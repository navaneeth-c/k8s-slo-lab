# Multi-window, multi-burn-rate alerting for a 99.9% / 30-day availability SLO.
#
# Error budget = 0.1% of requests. Burn rate = observed error ratio / 0.001.
# A sustained burn rate of 1 exhausts the budget in exactly 30 days; 14.4
# exhausts it in ~2 days; 6 exhausts it in ~5 days.
#
# SLI source: http_request_duration_seconds_count, NOT http_requests_total.
# podinfo's http_requests_total carries only a `status` label and its metrics
# middleware wraps every route — so at idle the counter is dominated by kubelet
# probes and Prometheus scrapes, with no `path` label to filter them out. The
# duration histogram's count carries {method, path, status}, which lets the SLI
# exclude /healthz, /readyz and /metrics and measure only real traffic. A side
# effect worth knowing: with probes excluded, an idle namespace has a 0/0 SLI
# (NaN), and NaN fails every comparison — so these alerts structurally cannot
# fire on a namespace receiving no traffic. That replaces the usual
# minimum-traffic guard clause.
#
# Everything is `sum by (namespace)`: default and prod burn independently, and
# each alert carries the namespace it fired for.
#
# Two windows, because one is never enough:
#
#   fast  1h @ 14.4x  -> critical.  Catches a hard breakage quickly. On its own
#                        it is twitchy: a short, sharp spike can clear the
#                        threshold and page for something already over.
#   slow  6h @ 6x     -> warning.   Catches the slow bleed that never trips the
#                        fast window but still eats the month's budget.
#
# Each alert is additionally gated on a short window (5m fast, 30m slow) that
# must ALSO be burning — the long window has a long memory, and without the
# short-window gate a resolved 10-minute outage keeps the 1h alert firing for
# most of an hour. This is the Google SRE Workbook multi-window pattern; the
# short-window condition is the half people usually leave out.
#
# These rules have unit tests: observability/alerts/tests/slo-rules.test.yaml,
# run by `make test-rules` and by CI.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: podinfo-slo-burn-rate
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: podinfo.slo
      rules:
        # ---- SLI recording rules -------------------------------------------
        - record: namespace:podinfo_http_error_ratio:rate5m
          expr: |
            sum by (namespace) (rate(http_request_duration_seconds_count{job="podinfo", status=~"5..", path!~"/healthz|/readyz|/metrics"}[5m]))
            /
            sum by (namespace) (rate(http_request_duration_seconds_count{job="podinfo", path!~"/healthz|/readyz|/metrics"}[5m]))

        - record: namespace:podinfo_http_error_ratio:rate30m
          expr: |
            sum by (namespace) (rate(http_request_duration_seconds_count{job="podinfo", status=~"5..", path!~"/healthz|/readyz|/metrics"}[30m]))
            /
            sum by (namespace) (rate(http_request_duration_seconds_count{job="podinfo", path!~"/healthz|/readyz|/metrics"}[30m]))

        - record: namespace:podinfo_http_error_ratio:rate1h
          expr: |
            sum by (namespace) (rate(http_request_duration_seconds_count{job="podinfo", status=~"5..", path!~"/healthz|/readyz|/metrics"}[1h]))
            /
            sum by (namespace) (rate(http_request_duration_seconds_count{job="podinfo", path!~"/healthz|/readyz|/metrics"}[1h]))

        - record: namespace:podinfo_http_error_ratio:rate6h
          expr: |
            sum by (namespace) (rate(http_request_duration_seconds_count{job="podinfo", status=~"5..", path!~"/healthz|/readyz|/metrics"}[6h]))
            /
            sum by (namespace) (rate(http_request_duration_seconds_count{job="podinfo", path!~"/healthz|/readyz|/metrics"}[6h]))

        # ---- Fast burn: 1h @ 14.4x, gated on 5m ----------------------------
        - alert: PodinfoSLOFastBurn
          expr: |
            namespace:podinfo_http_error_ratio:rate1h  > (14.4 * 0.001)
            and
            namespace:podinfo_http_error_ratio:rate5m  > (14.4 * 0.001)
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "podinfo ({{ $labels.namespace }}) is burning its 30-day error budget >14x too fast"
            description: >-
              1h error ratio in {{ $labels.namespace }} is {{ $value | humanizePercentage }},
              above 14.4x the allowed 0.1% budget rate, and the last 5 minutes are
              still burning. At this rate the 30-day budget is gone in ~2 days.
              Page-worthy: treat as an active incident.
            runbook_url: "https://github.com/navaneeth-c/k8s-slo-lab#why-two-burn-rate-windows-not-one"

        # ---- Slow burn: 6h @ 6x, gated on 30m ------------------------------
        - alert: PodinfoSLOSlowBurn
          expr: |
            namespace:podinfo_http_error_ratio:rate6h  > (6 * 0.001)
            and
            namespace:podinfo_http_error_ratio:rate30m > (6 * 0.001)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "podinfo ({{ $labels.namespace }}) is burning its 30-day error budget ~6x too fast"
            description: >-
              6h error ratio in {{ $labels.namespace }} is {{ $value | humanizePercentage }},
              above 6x the allowed 0.1% budget rate, and the last 30 minutes are
              still burning. At this rate the 30-day budget is gone in ~5 days.
              Not a page — but it needs an owner before the fast window catches it.
            runbook_url: "https://github.com/navaneeth-c/k8s-slo-lab#why-two-burn-rate-windows-not-one"

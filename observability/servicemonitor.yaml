# Wires Prometheus (via the Prometheus Operator) up to scrape podinfo's /metrics.
# Applied standalone (not part of the podinfo chart itself) so the chart has
# no hard dependency on the Prometheus Operator CRDs existing — it can be
# installed on a cluster with or without observability present.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: podinfo
  labels:
    app.kubernetes.io/name: podinfo
spec:
  # Without jobLabel, the operator derives the `job` label from the Service
  # NAME — which equals "podinfo" only while the Helm release happens to be
  # named podinfo. Every alert and dashboard query matches on job="podinfo",
  # so pin it to the app label instead of an accident of release naming.
  jobLabel: app.kubernetes.io/name
  # Without this, a ServiceMonitor only matches Services in its OWN namespace.
  # This one lives in `monitoring`; podinfo's Service lives in `default` — so
  # this has to be explicit, or Prometheus silently scrapes nothing. Hit this
  # for real on first deploy (targets page was empty, up{job="podinfo"} had no
  # data) before tracing it back to this.
  namespaceSelector:
    matchNames:
      - default   # dev deploy target, see scripts/deploy-podinfo.sh
      - prod      # scripts/deploy-podinfo.sh prod
  selector:
    matchLabels:
      app.kubernetes.io/name: podinfo
  endpoints:
    # podinfo serves /metrics on its single main port here — its dedicated
    # metrics port (--port-metrics) defaults to disabled and the chart doesn't
    # enable it. Port name matches the named port in
    # charts/podinfo/templates/service.yaml. (Second real bug found while
    # verifying: a 9797 metrics port carried over without the flag that
    # enables it. Confirmed by port-forwarding 9898 directly and getting a
    # real /metrics response, while 9797 was refusing connections.)
    - port: http
      path: /metrics
      interval: 15s

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "podinfo.fullname" . }}
  labels:
    {{- include "podinfo.labels" . | nindent 4 }}
data:
  # podinfo binds its --level flag as PODINFO_LEVEL (viper env prefix +
  # flag name). An earlier revision shipped PODINFO_LOG_LEVEL, which maps
  # to nothing and was silently ignored.
  PODINFO_LEVEL: {{ .Values.config.logLevel | quote }}
  PODINFO_UI_MESSAGE: {{ .Values.config.uiMessage | quote }}
  PODINFO_UI_COLOR: {{ .Values.config.uiColor | quote }}
